; MavLTE firmware for the Waveshare ESP32-S3-A7670E-4G.
; Build: pio run    Flash: pio run -t upload    Settings: pio run -t menuconfig    Log: pio device monitor
; Plain ESP-IDF works too: idf.py set-target esp32s3 && idf.py menuconfig build flash monitor

[platformio]
src_dir = main

[env:esp32s3-a7670e]
platform = espressif32@7.0.1   ; ESP-IDF 6.0.1
framework = espidf
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
