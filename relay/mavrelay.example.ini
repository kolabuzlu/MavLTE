# MavLTE configuration. Copy to /etc/mavrelay/mavrelay.ini (relay server) or next to mavrelay.py on your
# laptop (the MavLTE app and start-gcs.bat read the [gcs] section).
# Create each key with:  python3 mavrelay.py genkey

[server]
# UDP port for the vehicle and the GCS agents. Open it in the firewall.
listen = 0.0.0.0:14650
# Shared with the ESP32 (firmware setting "Vehicle key").
vehicle_key = PASTE_64_HEX_CHARACTERS_HERE
# Shared with the GCS agent on your laptop.
gcs_key = PASTE_ANOTHER_64_HEX_CHARACTERS_HERE
# Optional plain TCP port for Mission Planner without the agent. This port is NOT authenticated:
# only the networks in tcp_allow may connect. The default (loopback only) is meant for an SSH tunnel:
#   ssh -N -L 5760:127.0.0.1:5760 you@your-server   then connect Mission Planner to TCP 127.0.0.1:5760
#tcp_listen = 127.0.0.1:5760
#tcp_allow = 127.0.0.1/32, ::1/128
session_timeout = 120
log_level = info
# Photos from the aircraft (Snapshot in MavLTE), kept this many days. Default folder: snapshots, in
# /var/lib/mavrelay when run as the service, else next to this file. "off": in memory only.
#snapshot_dir = /var/lib/mavrelay/snapshots
#snapshot_days = 7

[gcs]
# Relay server address and the GCS key (same as gcs_key above).
server = your-server.example.com:14650
key = PASTE_THE_GCS_KEY_HERE
# Mission Planner: connect with UDP, port 14550 - or with TCP, 127.0.0.1, port 5760.
# 0.0.0.0 instead of 127.0.0.1 listens for GCS software on other computers too (Mission Planner
# there: UDPCl or TCP, with this computer's address and the port).
udp = 127.0.0.1:14550
tcp = 127.0.0.1:5760
status_interval = 10
# The MavLTE app keeps the aircraft's photos here (default: Pictures\MavLTE), and the size last chosen.
#photo_dir = D:\UAV\photos
#photo_size = medium

[vehicle]
# Only for bench tests with the Python vehicle (serial port or SITL) instead of the ESP32.
server = your-server.example.com:14650
key = PASTE_THE_VEHICLE_KEY_HERE
#serial = COM5:115200
tcp = 127.0.0.1:5762
batch_ms = 50
